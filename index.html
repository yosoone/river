<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Short texts that move like a quiet river: on breath, love, spring and surrendering to the flow.">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>River 川</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Layout: one quiet column; the home page is a running index like a river's course, each text sits alone on its own page */
:root{
  --ground:#EEEDE8; --paper:#F6F5F1; --ink:#1C1C1A; --ink-2:#3A3A36; --muted:#5A5A55; --rule:#D3D1CA; --accent:#2F3E5C;
  --display:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',Georgia,serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#181816; --paper:#20201D; --ink:#ECEBE5; --ink-2:#C9C8C1; --muted:#9A998F; --rule:#34332F; --accent:#A9B8D6; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#181816; --paper:#20201D; --ink:#ECEBE5; --ink-2:#C9C8C1; --muted:#9A998F; --rule:#34332F; --accent:#A9B8D6; color-scheme:dark}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.site{display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;justify-content:space-between;padding-block:32px 24px}
.mark{font-family:var(--display);font-size:26px;letter-spacing:.08em;text-decoration:none;color:var(--ink)}
.mark span{color:var(--muted);margin-left:.35em}
.byline{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* Home */
.intro{padding-block:56px 48px;border-bottom:1px solid var(--rule)}
.intro h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(56px,11vw,128px);line-height:1;letter-spacing:.02em;text-wrap:balance}
.intro h1 .kanji{display:inline-block;margin-left:.15em;color:var(--muted)}
.intro p{margin:20px 0 0;max-width:30em;color:var(--ink-2);font-size:17px}
.index{list-style:none;margin:0;padding:0 0 64px;columns:2 320px;column-gap:64px}
.index li{break-inside:avoid;border-bottom:1px solid var(--rule)}
.index a{display:flex;gap:20px;align-items:baseline;padding:18px 0;text-decoration:none;color:var(--ink);min-height:44px}
.index .t{min-width:0;font-family:var(--display);font-size:20px;line-height:1.4}
.index a:hover .t{color:var(--accent)}

/* Text page */
.piece{min-height:60vh;display:flex;flex-direction:column;justify-content:center;padding-block:64px 80px;border-top:1px solid var(--rule)}
.piece-inner{width:fit-content;max-width:min(36em,100%);margin:0 auto}
.verse{margin:0;font-family:var(--display);font-size:clamp(22px,3.4vw,30px);line-height:1.75;color:var(--ink);text-wrap:pretty}
.verse .stanza+.stanza{margin-top:1.4em}
.verse .line{display:block}
.sign{margin:44px 0 0;font-size:14px;letter-spacing:.12em;color:var(--muted)}
nav.pager{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;padding-block:28px;border-top:1px solid var(--rule);font-size:15px}
nav.pager a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center;max-width:100%}
nav.pager .mid{color:var(--muted)}
footer.site{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;padding-block:32px 48px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
@media (max-width:560px){nav.pager .mid{order:3;width:100%}}
@media (prefers-reduced-motion:no-preference){.piece-inner{animation:rise .6s ease both}@keyframes rise{from{opacity:.0001;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

<div class="wrap">
  <header class="site">
    <a class="mark" href="#home">River<span lang="ja">川</span></a>
    <span class="byline">Yoso · Miyazaki</span>
  </header>
  <main id="view"></main>
  <footer class="site">
    <span>© Yoso · Miyazaki, Japan</span>
    <span>Mind is home</span>
  </footer>
</div>

<script>
// First version of each draft in River 川/Desk/Draft, in file order. Text as written.
const TEXTS = [
 {n:0,  t:"Before reaching the shore", v:"Before reaching the shore,\nin the quiet sea of abstraction;\nSeize the mind."},
 {n:1,  t:"To feel with opened eyes", v:"To feel with opened eyes,\nto listen with the heart,\nto speak with truth."},
 {n:2,  t:"Wind’s Natural Soul", v:"Wind’s Natural Soul…\nLeading me to the unknown…\nTranscendental Flow."},
 {n:3,  t:"Breathe in", v:"Breathe in…\nBreathe out…\nThe energy that connects all forms…\nInfinite chains of chemical reactions…\nTrillions of cells living within…\nWhat am I?"},
 {n:4,  t:"Kind loving love", v:"Kind loving love,\nKind loving love,\nKind loving love."},
 {n:5,  t:"Submissiveness", v:"Submissiveness,\nalien to the shining soul,\nbreathing union is."},
 {n:6,  t:"I surrender to the flow", v:"I surrender to the flow…\nReaching the depth of my heart…\nUnion’s Embrace."},
 {n:7,  t:"Spring Energy", v:"Spring Energy,\nBlessing our hearts with promising light.\nEach blossom, a vow of harmony.\nWith gratitude, I honour your transience."},
 {n:17, t:"Awakening Mind", v:"Awakening mind…\nThat which is conscious…\nFor the good of sentience."},
 {n:18, t:"Present, mindful now", v:"Present, mindful now.\nPeaceful heart, a quiet mind.\nHarmony’s embrace."},
 {n:19, t:"Being is beyond knowledge", v:"Being is beyond knowledge,\nbeing is integrity,\nbeing is the totality.\n\nThe totality of your experiences,\nThe sacred energy that unites past and future to the present moment!"},
 {n:20, t:"To each cell", v:"Hands in prayer,\nI bow respectfully to each cell in my body,\nand to the life in you."},
 {n:21, t:"Heal yourself to heal others", v:"Heal yourself to heal others,\nHeal others to heal yourself."},
 {n:22, t:"First Love, Then Form", v:"First Love, Then Form."},
 {n:23, t:"There is no greater shock in life than birth", v:"There is no greater shock in life than birth,\nFighting for survival,\nDeath is release,"},
 {n:24, t:"Life itself", v:"Life itself...\nIs death itself...\n\nFull circle,\nBalance,\nDance...\n\nTransfer of energy...\nConsciousness...\n\nSurvival..."},
 {n:25, t:"In modern times", v:"In modern times,\nWe acquire knowledge,\nbelieving that it is the truth,\nonly to realize that it is only part of it!\n\nLife itself is knowledge!\nWithin Life itself resides the knowledge!\nThe multitude of Life forms that created our being!\nIt is when we tune in, that all become one!\n\nWhen we surrender with gratitude,\nwhen we learn to respect!\nthat our knowledge requires energy to survive,\nthat survival itself is ephemeral!\n\nthat each breath matters more than knowledge!\nand that at the end of the day,\nlife itself is the experience!"},
 {n:26, t:"End of Summer Full moon", v:"End of Summer Full moon,\nBright in the East…\nI could feel the cold wind in the morning rise…\nSummer afternoon…\nFeeling the Rain coming when you set your light…\nIt took me half a century to recognize, that both the Sun and you…\nMade me who I have become…\nA modern man seeking revenge on modern civilisation..\nFor hiding your beauty for so long..\nI am back, and choose to celebrate your dance and gentle light, until the last day of my winter…\nLet me celebrate many sunrises…"},
 {n:27, t:"Being One", v:"Being One.\nBecoming one.\nmicrocosm and Macrocosm.\nOne"},
 {n:28, t:"With each petal in the wind", v:"With each petal in the wind,\nI vow to dedicate myself to prosperity and harmony for sentient life."},
 {n:29, t:"Like a petal in the wind", v:"Like a petal in the wind,\nI surrender to the flow..."},
 {n:30, t:"Do not love Love", v:"Do not love Love,\nBe love,\nLove."},
 {n:31, t:"The spring awakes", v:"The spring awakes,\nThe Golden Heart is Here!\nPure Counsciousness."},
 {n:32, t:"Your Mind is your home", v:"Your Mind is your home"},
 {n:33, t:"With each blossom", v:"With each blossom,\nI vow to dedicate myself to prosperity and harmony for sentient life."},
 {n:38, t:"A quiet river", v:"Thank you for always being by my side.\nWith you, my heart flows like a quiet river."}
];

const view = document.getElementById('view');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');

function verseHTML(v){
  return v.split(/\n\s*\n/).map(st =>
    '<span class="stanza" style="display:block">' +
    st.split('\n').map(l => '<span class="line">' + esc(l) + '</span>').join('') +
    '</span>').join('');
}

function home(){
  document.title = 'River 川';
  view.innerHTML =
    '<section class="intro"><div><h1>River<span class="kanji" lang="ja">川</span></h1>' +
    '<p>Short texts that move like a quiet river: on breath, love, spring and surrendering to the flow.</p></div></section>' +
    '<ol class="index">' + TEXTS.map(x =>
      '<li><a href="#t' + x.n + '"><span class="t">' + esc(x.t) + '</span></a></li>'
    ).join('') + '</ol>';
}

function piece(i){
  const L = TEXTS.length, x = TEXTS[i], prev = TEXTS[(i - 1 + L) % L], next = TEXTS[(i + 1) % L];
  document.title = x.t + ' · River 川';
  view.innerHTML =
    '<article class="piece" aria-label="' + esc(x.t) + '"><div class="piece-inner">' +
    '<p class="verse">' + verseHTML(x.v) + '</p>' +
    '<p class="sign">– Yoso</p></div></article>' +
    '<nav class="pager" aria-label="More texts">' +
    (prev ? '<a href="#t' + prev.n + '">← ' + esc(prev.t) + '</a>' : '<span></span>') +
    '<a class="mid" href="#home">All texts</a>' +
    (next ? '<a href="#t' + next.n + '">' + esc(next.t) + ' →</a>' : '<span></span>') +
    '</nav>';
}

let nav = null; // hashes of the current text's neighbours, for swiping

// Phone: swipe left for the next text, right for the previous one
let sx = 0, sy = 0, st = 0;
window.addEventListener('touchstart', e => {
  const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; st = Date.now();
}, {passive:true});
window.addEventListener('touchend', e => {
  if (!nav) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Date.now() - st > 800 || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  location.hash = dx < 0 ? nav.next : nav.prev;
}, {passive:true});

function route(){
  const h = location.hash.replace('#','');
  const m = /^t(\d+)$/.exec(h);
  const i = m ? TEXTS.findIndex(x => x.n === Number(m[1])) : -1;
  if (i >= 0) {
    const L = TEXTS.length;
    nav = { prev: 't' + TEXTS[(i - 1 + L) % L].n, next: 't' + TEXTS[(i + 1) % L].n };
    piece(i);
  } else { nav = null; home(); }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
</script>

</body>
</html>
